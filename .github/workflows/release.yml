name: Release

# Fires on any tag matching vX.Y.Z (optionally with a -rc1 style suffix), e.g.
#   git tag v1.2.3 && git push origin v1.2.3
#
# Builds both binaries - goca (server + local CLI) and gocactl (remote client)
# - for every supported OS/arch, publishes them as a GitHub Release, and
# builds+pushes a multi-arch Docker image to ghcr.io/mevijays/goca tagged with
# the version. Neither binary has a cgo dependency (the SQLite driver is pure
# Go), so every binary and every image platform is cross-compiled natively -
# no QEMU emulation, no per-OS runners needed.
#
# Each platform yields two release assets:
#   goca_<version>_<os>_<arch>.tar.gz      both binaries
#   gocactl_<version>_<os>_<arch>.tar.gz   the client on its own
# (.zip on Windows), plus a single checksums.txt covering every asset.
#
# Also builds+pushes a multi-arch External Secrets Operator image with goca's
# native provider compiled in, to ghcr.io/mevijays/external-secrets-goca -
# see integrations/eso-provider/README.md for what that is and how it's put
# together (upstream ESO, pinned by integrations/eso-provider/ESO_REF, with
# a small vendored overlay - not a full fork).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write # create the release and upload assets
  packages: write # push to ghcr.io

jobs:
  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EXT=""
          [ "${GOOS}" = "windows" ] && EXT=".exe"

          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/mevijays/goca/internal/cli.Version=${VERSION} \
              -X github.com/mevijays/goca/internal/cli.Commit=${COMMIT} \
              -X github.com/mevijays/goca/internal/cli.Date=${DATE}" \
            -o "build/goca${EXT}" .

          # gocactl, the remote client, ships in the same archive so that a
          # download always pairs a client with the server it was built from.
          # Its build stamp lives in internal/rcli, hence the second ldflag set.
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/mevijays/goca/internal/rcli.Version=${VERSION} \
              -X github.com/mevijays/goca/internal/rcli.Commit=${COMMIT} \
              -X github.com/mevijays/goca/internal/rcli.Date=${DATE}" \
            -o "build/gocactl${EXT}" ./cmd/gocactl

      - name: Package
        run: |
          set -euo pipefail
          BOTH="goca_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          CLIENT="gocactl_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist"

          # Two archives per platform, deliberately:
          #
          #   goca_...     both binaries, for whoever runs the server. Keeping
          #                gocactl in here means a server operator always has a
          #                client of exactly the matching version.
          #   gocactl_...  the client alone (~7 MB against ~32 MB), for the far
          #                more common case of someone who only administers a
          #                goca they do not host.
          #
          # The goca_ names are unchanged, so existing install scripts and
          # documented download URLs keep working.
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd build && zip -j "../dist/${BOTH}.zip" goca.exe gocactl.exe)
            (cd build && zip -j "../dist/${CLIENT}.zip" gocactl.exe)
          else
            tar -C build -czf "dist/${BOTH}.tar.gz" goca gocactl
            tar -C build -czf "dist/${CLIENT}.tar.gz" gocactl
          fi

          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: goca_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mevijays/goca
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Set build date
        id: vars
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.vars.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  eso-operator:
    name: Build and push ESO+goca-provider image
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image tracks a pinned upstream ESO tag independent of goca's own
      # version (see integrations/eso-provider/README.md for why there's no
      # full fork here) - read it once so both the build-arg and the image
      # tag below use the exact same value.
      - name: Read pinned upstream ESO tag
        id: eso
        run: echo "ref=$(cat integrations/eso-provider/ESO_REF)" >> "$GITHUB_OUTPUT"

      - name: Build metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mevijays/external-secrets-goca
          tags: |
            type=raw,value=${{ steps.eso.outputs.ref }}-goca
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: integrations/eso-provider/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ESO_REF=${{ steps.eso.outputs.ref }}
          cache-from: type=gha,scope=eso-operator
          cache-to: type=gha,mode=max,scope=eso-operator
