name: Release

# Fires on any tag matching vX.Y.Z (optionally with a -rc1 style suffix), e.g.
#   git tag v1.2.3 && git push origin v1.2.3
#
# Builds a binary for every supported OS/arch, publishes them as a GitHub
# Release, and builds+pushes a multi-arch Docker image to
# ghcr.io/mevijays/goca tagged with the version. goca has no cgo dependency
# (the SQLite driver is pure Go), so every binary and every image platform is
# cross-compiled natively - no QEMU emulation, no per-OS runners needed.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write # create the release and upload assets
  packages: write # push to ghcr.io

jobs:
  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUT="goca"
          [ "${GOOS}" = "windows" ] && OUT="goca.exe"

          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/mevijays/goca/internal/cli.Version=${VERSION} \
              -X github.com/mevijays/goca/internal/cli.Commit=${COMMIT} \
              -X github.com/mevijays/goca/internal/cli.Date=${DATE}" \
            -o "build/${OUT}" .

      - name: Package
        run: |
          set -euo pipefail
          NAME="goca_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd build && zip -j "../dist/${NAME}.zip" goca.exe)
          else
            tar -C build -czf "dist/${NAME}.tar.gz" goca
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: goca_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mevijays/goca
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Set build date
        id: vars
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.vars.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
