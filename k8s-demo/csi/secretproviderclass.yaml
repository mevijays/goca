# Two example SecretProviderClasses: a kv secret mounted as one file, and a
# certificate secret mounted as the standard tls.crt/tls.key/ca.crt triad
# (renamed here just to show "items" works - the defaults would do the same
# thing unrenamed).
#
# Before applying:
#   1. Replace GOCA_BASE_URL, or drop the gocaAddress line entirely if the
#      provider DaemonSet already has a --goca-address default.
#   2. Create the secrets these reference and bind them to the namespace/
#      ServiceAccount the pod in pod.yaml runs as - see README.md step 3.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: goca-db-password
  namespace: default
spec:
  provider: goca
  parameters:
    gocaAddress: https://GOCA_BASE_URL
    objects: |
      - secretName: demo/db/password
        fileName: db-password
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: goca-web-tls
  namespace: default
spec:
  provider: goca
  parameters:
    gocaAddress: https://GOCA_BASE_URL
    objects: |
      - secretName: demo/web-tls
        items: { cert: server.crt, key: server.key, ca: ca.crt }
